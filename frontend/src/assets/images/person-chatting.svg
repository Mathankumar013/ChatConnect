<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <!-- Background Soft Radial Ambient -->
  <defs>
    <linearGradient id="bubbleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128C7E"/>
      <stop offset="100%" stop-color="#075E54"/>
    </linearGradient>
    <linearGradient id="bubbleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2C34"/>
      <stop offset="100%" stop-color="#111B21"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Circular Backdrop -->
  <circle cx="200" cy="180" r="140" fill="#E7FCE3" opacity="0.6"/>
  <circle cx="200" cy="180" r="110" fill="#EFEAE2" opacity="0.8"/>

  <!-- Person Body / Clothing -->
  <path d="M125 320C125 260 155 240 200 240C245 240 275 260 275 320Z" fill="#128C7E"/>
  <!-- Shirt Collar -->
  <path d="M185 240L200 262L215 240Z" fill="#FFFFFF"/>

  <!-- Neck -->
  <rect x="188" y="215" width="24" height="30" fill="#FBD38D" rx="4"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="170" rx="38" ry="46" fill="#FBD38D"/>

  <!-- Hair -->
  <path d="M160 160C160 120 175 115 200 115C225 115 240 120 240 160C235 135 220 130 200 130C180 130 165 135 160 160Z" fill="#2D3748"/>
  <path d="M162 165C158 140 168 120 200 118C232 120 242 140 238 165C232 148 220 138 200 138C180 138 168 148 162 165Z" fill="#1A202C"/>

  <!-- Smile & Cheerful Eyes -->
  <path d="M180 162C182 159 187 159 189 162" stroke="#2D3748" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M211 162C213 159 218 159 220 162" stroke="#2D3748" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M190 188C194 196 206 196 210 188" stroke="#E53E3E" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Smartphone held in hands -->
  <rect x="180" y="235" width="40" height="68" rx="8" fill="url(#phoneGrad)" filter="url(#cardShadow)"/>
  <rect x="184" y="240" width="32" height="56" rx="4" fill="#EFEAE2"/>
  <line x1="188" y1="248" x2="204" y2="248" stroke="#128C7E" stroke-width="3" stroke-linecap="round"/>
  <line x1="196" y1="256" x2="212" y2="256" stroke="#25D366" stroke-width="3" stroke-linecap="round"/>
  <line x1="188" y1="264" x2="208" y2="264" stroke="#128C7E" stroke-width="3" stroke-linecap="round"/>

  <!-- Hands holding phone -->
  <ellipse cx="178" cy="275" rx="10" ry="14" fill="#FBD38D" transform="rotate(-15 178 275)"/>
  <ellipse cx="222" cy="275" rx="10" ry="14" fill="#FBD38D" transform="rotate(15 222 275)"/>

  <!-- Floating Chat Bubble Left (Incoming Message) -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="90" width="135" height="50" rx="10" fill="#FFFFFF"/>
    <path d="M160 120L172 126L160 132Z" fill="#FFFFFF"/>
    <circle cx="48" cy="115" r="14" fill="#E2E8F0"/>
    <text x="48" y="119" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#4A5568">👩</text>
    <text x="70" y="112" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#111B21">Hey Mathan! 👋</text>
    <text x="70" y="126" font-family="-apple-system, sans-serif" font-size="9" fill="#718096">Are you online?</text>
  </g>

  <!-- Floating Chat Bubble Right (Outgoing Message) -->
  <g filter="url(#cardShadow)">
    <rect x="235" y="125" width="140" height="52" rx="10" fill="#D9FDD3"/>
    <path d="M235 152L223 158L235 164Z" fill="#D9FDD3"/>
    <text x="250" y="147" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#111B21">Yes, always here! 🚀</text>
    <text x="250" y="163" font-family="-apple-system, sans-serif" font-size="9" fill="#128C7E">10:45 AM</text>
    <!-- Double Blue Check -->
    <path d="M346 160L350 164L358 156" stroke="#53BDEB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M351 160L355 164L363 156" stroke="#53BDEB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Floating Audio Note Pill -->
  <g filter="url(#cardShadow)">
    <rect x="230" y="55" width="125" height="36" rx="18" fill="#FFFFFF"/>
    <circle cx="248" cy="73" r="11" fill="#128C7E"/>
    <polygon points="246,68 253,73 246,78" fill="#FFFFFF"/>
    <line x1="266" y1="73" x2="270" y2="73" stroke="#25D366" stroke-width="3" stroke-linecap="round"/>
    <line x1="274" y1="69" x2="278" y2="77" stroke="#128C7E" stroke-width="3" stroke-linecap="round"/>
    <line x1="282" y1="66" x2="286" y2="80" stroke="#128C7E" stroke-width="3" stroke-linecap="round"/>
    <line x1="290" y1="70" x2="294" y2="76" stroke="#128C7E" stroke-width="3" stroke-linecap="round"/>
    <text x="312" y="76" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#718096">0:14</text>
  </g>
</svg>

